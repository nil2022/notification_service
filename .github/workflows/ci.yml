name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the jobs only need to read the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Production dependencies only; dev-only advisories (e.g. nodemon -> braces) don't ship
      - run: npm audit --omit=dev --audit-level=high
